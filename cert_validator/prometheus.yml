# Prometheus configuration for Certificate Validator

global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - "alert_rules.yml"

scrape_configs:
  - job_name: 'cert_validator'
    static_configs:
      - targets: ['cert-validator:8001']
    metrics_path: '/metrics'
    scrape_interval: 30s
