detection:
  behavior_threshold: 5
  terminate_threshold: 8
  threat_threshold: 5
expert_system:
  enabled: true
  escalation:
    alert_soc: true
    threshold: 5
    window_seconds: 60
  weights:
    behavioral: 1.5
    malwarebazaar: 3.5
    mitre: 2.0
    ml: 2.0
    virustotal: 2.5
    yara: 3.0
langgraph:
  enabled: false
  log_state_transitions: true
logging:
  level: INFO
  log_file: logs/hidr.log
  log_to_file: true
  max_log_size_mb: 10
malwarebazaar:
  enabled: true
  query_threshold: 5
  timeout: 3
monitoring:
  behavior_timeout: 0.5
  process_scan_interval: 0.05
  vt_timeout: 2
paths:
  temp_dirs:
  - temp
  - downloads
  - appdata\local\temp
  trusted_paths:
  - c:\windows\
  - c:\program files\
  - c:\program files (x86)\
  - c:\users\laksh\appdata\local\powertoys\
  - c:\users\laksh\.vscode\
  - c:\users\laksh\appdata\local\programs\
  - l:\softwares\
  - c:\programdata\microsoft\windows defender\
  - c:\program files\windows defender\
  - c:\program files\microsoft vs code\
  - c:\program files\git\
threats:
  malware_names:
  - keylogger.exe
  - stealer.exe
  - logger.exe
  - backdoor.exe
  - trojan.exe
  ransomware_names:
  - encryptor.exe
  - locker.exe
  - crypt.exe
  - ransomware.exe
  rat_names:
  - rat.exe
  - njrat.exe
  - darkcomet.exe
  - cybergate.exe
  - poison.exe
  - blackshades.exe
  - remcos.exe
  - asyncrat.exe
yara:
  enabled: true
  log_skipped_files: true
  max_file_size_mb: 50
  rules_dir: yara_rules
  scan_files: true
  scan_processes: false
  scan_timeout: 5
  skip_large_files: true
cert_validator:
  enabled: true
  api_url: http://localhost:8001
  api_key: hidr-agent-key-12345
  timeout: 2
